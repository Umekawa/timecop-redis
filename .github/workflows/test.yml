on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  test_per_ruby_version:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - 3.2
          - 3.3
          - 3.4
    services:
      redis:
        image: redis:5.0.0
        ports:
          - "6379:6379"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651 # v1.245.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
  test_per_redis_version:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redis:
          - redis:5.0.14
          - redis:6.2.19
          - redis:7.4.5
          - redis:8.0.3
          - redis:8.2.1
          - valkey/valkey:7.2.10
          - valkey/valkey:8.0.5
          - valkey/valkey:8.1.3
    services:
      redis:
        image: ${{ matrix.redis }}
        ports:
          - "6379:6379"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651 # v1.245.0
        with:
          ruby-version: 3.4
          bundler-cache: true
      - run: bundle exec rspec
